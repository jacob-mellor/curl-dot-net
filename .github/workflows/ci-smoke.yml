name: CI Smoke & Integration Tests

on:
  push:
    branches: [ main, master ]  # Support both main and master
  pull_request:
    # Triggers on PRs to any branch
    branches: [ '*' ]

# A new push to the same branch cancels the run still in progress
concurrency:
  group: ci-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-integration-test:
    name: Smoke & Integration Tests - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: true  # Stop all jobs if one fails

    steps:
    # Step 1: Checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step 2: Setup .NET SDKs
    - name: Setup .NET SDK 8.0.x
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        dotnet-quality: 'ga'  # Use stable GA release, not preview

    - name: Setup .NET SDK 9.0.x
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        dotnet-quality: 'ga'  # Use stable GA release

    - name: Setup .NET SDK 10.0.x
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'ga'

    # Step 3: Restore dependencies
    - name: Restore dependencies
      run: dotnet restore

    # Step 4: Build solution in Release configuration
    - name: Build solution (Release)
      run: dotnet build --configuration Release --no-restore

    # Step 5: Unit, synthetic, smoke and DevOps tests on .NET 8/9/10. Everything runs against an
    # in-process HttpListener server (no fixed ports, no internet), so each run takes seconds.
    - name: Run unit, synthetic, smoke and DevOps tests (.NET 8, 9, 10)
      shell: bash
      run: |
        for tfm in net8.0 net9.0 net10.0; do
          echo "::group::$tfm"
          dotnet test tests/CurlDotNet.Tests/CurlDotNet.Tests.csproj --configuration Release --no-build --framework $tfm --filter "Category=Synthetic|Category=Unit|Category=Smoke|Category=DevOps" --blame-hang --blame-hang-timeout 180s --blame-hang-dump-type none
          echo "::endgroup::"
        done

    # Step 5b: .NET Framework 4.7.2 / 4.8 (Windows only): the smoke and DevOps categories, as before.
    # The full suite's in-process servers and TLS fixtures are written for .NET 8+.
    - name: Run smoke and DevOps tests (.NET Framework 4.7.2 and 4.8)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        for tfm in net472 net48; do
          echo "::group::$tfm"
          dotnet test tests/CurlDotNet.Tests/CurlDotNet.Tests.csproj --configuration Release --no-build --framework $tfm --filter "Category=DevOps|Category=Smoke" --blame-hang --blame-hang-timeout 180s --blame-hang-dump-type none
          echo "::endgroup::"
        done

    # Step 6: Replay curl's own test suite (tests/CurlDotNet.CurlSuite) against the local stub server.
    # Tests listed in known-failures.txt are expected to fail; one that starts passing fails the run
    # so the list stays honest. Ubuntu only: the result is OS-independent and this keeps CI time down.
    - name: Replay curl test suite
      if: matrix.os == 'ubuntu-latest'
      run: dotnet test tests/CurlDotNet.CurlSuite/CurlDotNet.CurlSuite.csproj --configuration Release --no-build --framework net10.0 --blame-hang --blame-hang-timeout 300s --blame-hang-dump-type none

    - name: Upload curl suite report
      if: matrix.os == 'ubuntu-latest' && always()
      uses: actions/upload-artifact@v4
      with:
        name: curl-suite-report
        path: tests/CurlDotNet.CurlSuite/curl-suite-report.md
        if-no-files-found: ignore

    # Optional: Report test results summary
    - name: Test Results Summary
      if: always()
      run: |
        echo "✅ Smoke/Integration tests completed on ${{ matrix.os }}"
        echo "📝 This CI runs smoke/integration tests only - developers should run full test suite locally before pushing"

# Workflow Notes:
# ================
# - Runs the full offline unit suite on all three OSes and the curl test-suite replay on Ubuntu
# - The solution build also compiles examples/ so samples cannot drift from the API
# - Triggers on: push to 'main' branch, and PRs to any branch
# - Uses .NET SDK 8.0.x across all platforms (Ubuntu, Windows, macOS)
# - Will exit with failure if any smoke/integration test fails
# - Assumes tests are properly categorized with [Category("Smoke")] or [Category("Integration")] attributes
#
# Common mis-configuration fixes applied:
# - Using correct branch name 'main' (not 'master') for push trigger
# - Using proper test filter syntax with Category attribute
# - Ensuring .NET 8.0.x is consistently used (not older versions)
# - Including all three major OS runners in the matrix
# - Using --no-build flag to avoid redundant builds during test phase